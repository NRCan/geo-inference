[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-inference"
description = "Extract features from geospatial imagery using deep learning models"
readme = "README.md"
authors = [{ name = "Victor Alhassan", email = "victor.alhassan@nrcan-rncan.gc.ca" }]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]
keywords = ["pytorch", "deep learning", "machine learning", "remote sensing", "satellite imagery", "earth observation", "geospatial"]
dynamic = ["version"]
requires-python = ">=3.12.0,<3.13"

dependencies = [
    "numpy>=2.3.0,<2.4.0",
    "pandas>=2.3.0,<2.4.0",

    "geopandas>=1.1.0,<2.0.0",
    "rasterio>=1.4.0,<1.5.0",
    "rioxarray>=0.15.6,<0.23.0",
    "xarray>=2024.6.0,<2027.1.0",
    "scikit-image>=0.26.0,<0.27.0",
    "pyogrio>=0.12.0,<0.13.0",
    "rtree>=1.0.0,<2.0.0",
    "pystac>=1.10.1,<1.15.0",
    "segment-geospatial[samgeo3]>=1.3.1,<2.0.0",
    "dask[distributed]>=2024.6.2,<2027.1.0",

    "matplotlib>=3.10.0,<4.0.0",
    "requests>=2.32.3,<2.33.0",
    "PyYAML>=6.0.0,<7.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "colorlog>=6.7.0,<7.0.0",
    "nvidia-ml-py>=13.4.0,<14.0.0",
    "jupyterlab>=4.0.0,<6.0.0",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}


[project.optional-dependencies]
cu128 = [
  "torch>=2.8.0,<2.9.0",
  "torchvision>=0.23.0,<0.24.0",
]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest"]

[project.urls]
Homepage = "https://github.com/NRCan/geo-inference"

[project.scripts]
geo_inference = "geo_inference.geo_inference:main"

[tool.setuptools.packages.find]
include = ["geo_inference*"]

[tool.bumpver]
current_version = "3.2.4"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"VERSION" = ["{version}"]
"pyproject.toml" = [
    '^current_version = "{version}"',]
"geo_inference/__init__.py" = ["{version}"]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv",
    ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist",
    "node_modules", "site-packages", "venv"
]
line-length = 88
indent-width = 4
target-version = "py312"

# Enable full PEP 8 + modern checks
select = ["ALL"]
ignore = [
    "D203",  # conflicting docstring rules
    "D212",  # same, docstring starts on wrong line
    "ANN101", "ANN102",  # allow skipping `self`, `cls` annotations
    "EXE002", # ignore missing executable bit on scripts with shebangs
    "ERA001", # ignore commented out code
]

# You can limit to specific rule groups instead of ALL:
# select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D", "PT"]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"